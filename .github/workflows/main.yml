name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download source files
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Prepare files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package-input
          Copy-Item MyProgram.jar package-input/
          Copy-Item gpc_shl_database.dat package-input/

      - name: Build EXE
        shell: pwsh
        run: |
          jpackage `
            --type exe `
            --input package-input `
            --dest dist `
            --name MyProgram `
            --main-jar MyProgram.jar `
            --main-class Main

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MyProgram-Windows
          path: dist/*.exe
